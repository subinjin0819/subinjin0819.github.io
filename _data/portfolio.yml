hero:
  eyebrow: "BIOMEDICAL ENGINEERING · BIOELECTRONIC MATERIALS"
  headline: "Injectable bioelectronics for seamless tissue interfacing"
  subheadline: >
    I engineer soft, injectable, and electrically active biomaterials that create
    minimally invasive interfaces with biological tissues—linking material design
    to neuromodulation, closed-loop rehabilitation, and regeneration.
  primary_cta: "Explore research"
  primary_url: "/research/"
  secondary_cta: "Publications"
  secondary_url: "/publications/"

